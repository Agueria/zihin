# XcodeGen manifesti — Mac'te: `brew install xcodegen && xcodegen generate`
# Target'lar, App Group / Keychain / iCloud entitlement'ları, plist'ler ve SPM
# bağımlılıkları tek komutla kurulur (elle kurulum: docs/SETUP_MAC.md Yol B).
name: Zihin
options:
  bundleIdPrefix: app.zihin
  deploymentTarget:
    iOS: "26.0"   # v2 (2026-07-09): FoundationModels her zaman derlenir; kullanımı availability ile kapılanır
  createIntermediateGroups: true

packages:
  GRDB:
    url: https://github.com/duckduckgo/GRDB.swift
    # DİKKAT: exactVersion şart. Fork, upstream groue/GRDB.swift'in `vX.Y.Z`
    # tag'lerini de taşıyor; `from:` kullanılırsa SPM DDG'nin release'i yerine
    # upstream'in eski tag'ini seçer (ör. from 2.0.0 → v2.10.0, 2018 sürümü).
    # 3.0.0 = GRDB 7.4.1 + SQLCipher 4.7.0.
    exactVersion: "3.0.0"
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup
    from: "2.6.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # SQLCipher şifrelemesini açar (E3, spec §4). Düz GRDB kullanacaksan kaldır.
    SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) ZIHIN_ENCRYPTED"

targets:
  Zihin:
    type: application
    platform: iOS
    sources: [Zihin]
    dependencies:
      - package: GRDB
      - package: SwiftSoup
      - target: ShareExtension
    info:
      path: Config/Zihin-Info.plist
      properties:
        CFBundleDisplayName: Zihin
        UILaunchScreen: {}
        NSPhotoLibraryUsageDescription: "Kaydettiğin görselleri ve videoları içe aktarmak için."
        NSSpeechRecognitionUsageDescription: "Videolardaki konuşmayı cihazında metne çevirmek için."
        NSMicrophoneUsageDescription: "Ekran kaydı içeriğini işlemek için."
    entitlements:
      path: Config/Zihin.entitlements
      properties:
        com.apple.security.application-groups: [group.app.zihin]
        keychain-access-groups:
          - $(AppIdentifierPrefix)app.zihin.shared
        com.apple.developer.icloud-container-identifiers: [iCloud.app.zihin]
        com.apple.developer.icloud-services: [CloudKit]

  ShareExtension:
    type: app-extension
    platform: iOS
    # App extension bundle id'si host app'in id'siyle prefix'lenmek ZORUNDA.
    # Varsayılan (bundleIdPrefix + target adı) app.zihin.ShareExtension üretir ve embed adımı patlar.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.zihin.Zihin.ShareExtension
    # Extension yalnız hafif katmanı derler (spec §3.2): Data + IngestionService.
    sources:
      - ShareExtension
      - Zihin/Data
      - Zihin/Capture/IngestionService.swift
    dependencies:
      - package: GRDB
    info:
      path: Config/ShareExtension-Info.plist
      properties:
        CFBundleDisplayName: Zihin
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsMovieWithMaxCount: 1
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsFileWithMaxCount: 5
    entitlements:
      path: Config/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups: [group.app.zihin]
        keychain-access-groups:
          - $(AppIdentifierPrefix)app.zihin.shared

  ZihinTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ZihinTests]
    dependencies:
      - target: Zihin
